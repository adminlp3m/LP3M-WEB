/* =========================================================
   CEK ADMIN
========================================================= */

function cekAdmin() {

    try {

        const userData =
            localStorage.getItem("user");

        if (!userData) {
            return false;
        }


        const user =
            JSON.parse(userData);


        return (
            user &&
            String(user.role || "").toLowerCase() === "admin"
        );

    }
    catch (error) {

        console.error(
            "Gagal membaca data user:",
            error
        );

        return false;
    }

}

/* =========================================================
   LOAD DATA JURNAL
========================================================= */

async function loadJurnalTable() {

    try {

            "Memuat data...";

            <tr>

                <td
                    colspan="${isAdmin ? 10 : 9}"

        const response =

        console.log(
            "Response getJurnal:",

            !Array.isArray(result.data)

                result.message ||

        semuaDataJurnal =

    catch (error) {

            error
        );


        jumlahData.innerText =
            "0 data";


        jurnalTableBody.innerHTML = `

                </td>

            </tr>

        `;

}



/* =========================================================
   KONVERSI TANGGAL
   UNTUK SORTING
========================================================= */

function ubahKeTanggal(value) {

    if (!value) {
        return null;
    }


    const teks =
        String(value).trim();


    /*
       FORMAT ISO

       Contoh:
       2026-09-09T17:00:00.000Z

       Yang digunakan hanya:
       2026-09-09

       Tidak menggunakan new Date(ISO)
       agar tanggal tidak bergeser karena timezone.
    */

    const isoMatch =
        teks.match(
            /^(\d{4})-(\d{2})-(\d{2})/
        );


    if (isoMatch) {

        const tahun =
            Number(isoMatch[1]);

        const bulan =
            Number(isoMatch[2]);

        const hari =
            Number(isoMatch[3]);


        const tanggal =
            new Date(
                tahun,
                bulan - 1,
                hari
            );


        if (!isNaN(tanggal.getTime())) {

            return tanggal;

        }

    }



    /*
       FORMAT DD/MM/YYYY
    */

    const parts =
        teks.split("/");


    if (parts.length === 3) {

        const hari =
            Number(parts[0]);

        const bulan =
            Number(parts[1]);

        const tahun =
            Number(parts[2]);


        const tanggal =
            new Date(
                tahun,
                bulan - 1,
                hari
            );


        if (!isNaN(tanggal.getTime())) {

            return tanggal;

        }

    }


    return null;

}



/* =========================================================
   FORMAT TANGGAL TAMPILAN
========================================================= */

function formatTanggalTampil(value) {

    if (!value) {
        return "";
    }


    const teks =
        String(value).trim();


    /*
       FORMAT ISO

       2026-09-09T17:00:00.000Z

       HASIL:

       09 09 26
    */

    const isoMatch =
        teks.match(
            /^(\d{4})-(\d{2})-(\d{2})/
        );


    if (isoMatch) {

        const tahun =
            isoMatch[1].slice(-2);

        const bulan =
            isoMatch[2];

        const hari =
            isoMatch[3];


        return (
            hari +
            " " +
            bulan +
            " " +
            tahun
        );

    }



    /*
       FORMAT DD/MM/YYYY
    */

    const dmyMatch =
        teks.match(
            /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );


    if (dmyMatch) {

        const hari =
            String(dmyMatch[1])
                .padStart(2, "0");

        const bulan =
            String(dmyMatch[2])
                .padStart(2, "0");

        const tahun =
            dmyMatch[3].slice(-2);


        return (
            hari +
            " " +
            bulan +
            " " +
            tahun
        );

    }


    return "";

}



/* =========================================================
   FORMAT TANGGAL UNTUK INPUT DATE
========================================================= */

function formatTanggalInput(value) {

    if (!value) {
        return "";
    }


    const teks =
        String(value).trim();


    /*
       FORMAT:

       2026-09-09T17:00:00.000Z

       HASIL:

       2026-09-09
    */

    const isoMatch =
        teks.match(
            /^(\d{4})-(\d{2})-(\d{2})/
        );


    if (isoMatch) {

        return (
            isoMatch[1] +
            "-" +
            isoMatch[2] +
            "-" +
            isoMatch[3]
        );

    }



    /*
       FORMAT:

       DD/MM/YYYY
    */

    const parts =
        teks.split("/");


    if (parts.length === 3) {

        const hari =
            String(parts[0])
                .padStart(2, "0");

        const bulan =
            String(parts[1])
                .padStart(2, "0");

        const tahun =
            parts[2];


        return (
            tahun +
            "-" +
            bulan +
            "-" +
            hari
        );

    }


    return "";

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}



/* =========================================================
   FORMAT PENULIS
========================================================= */

function formatPenulis(penulis) {

    if (Array.isArray(penulis)) {

        return penulis.join(", ");

    }


    return penulis || "";

}



/* =========================================================
   DATA YANG SEDANG DITAMPILKAN
========================================================= */

function ambilDataTampil() {

    const keyword =
        searchInput.value
            .trim()
            .toLowerCase();


    let data =
        [...semuaDataJurnal];


    /*
       SEARCH
    */

    if (keyword !== "") {

        data =
            data.filter(
                function(jurnal) {

                    const teks = [

                        jurnal.namaDosen,

                        jurnal.progdi,

                        jurnal.judul,

                        formatPenulis(
                            jurnal.penulis
                        ),

                        jurnal.tanggalTerbit,

                        jurnal.sitasi,

                        jurnal.status

                    ]
                        .join(" ")
                        .toLowerCase();


                    return teks.includes(
                        keyword
                    );

                }
            );

    }



    /*
       SORTING
    */

    data.sort(
        function(a, b) {

            const tanggalA =
                ubahKeTanggal(
                    a.tanggalTerbit
                );


            const tanggalB =
                ubahKeTanggal(
                    b.tanggalTerbit
                );


            if (
                !tanggalA &&
                !tanggalB
            ) {

                return 0;

            }


            if (!tanggalA) {

                return 1;

            }


            if (!tanggalB) {

                return -1;

            }


            if (
                sortTanggal.value ===
                "terlama"
            ) {

                return (
                    tanggalA -
                    tanggalB
                );

            }


            return (
                tanggalB -
                tanggalA
            );

        }
    );


    return data;

}



/* =========================================================
   PROSES DATA
========================================================= */

function prosesData() {

    const data =
        ambilDataTampil();


    tampilkanJurnal(data);

}



/* =========================================================
   TAMPILKAN JURNAL
========================================================= */

function tampilkanJurnal(data) {

    jumlahData.innerText =
        data.length +
        " data";


    if (data.length === 0) {

        jurnalTableBody.innerHTML = `

            <tr>

                <td
                    colspan="${isAdmin ? 10 : 9}"
                    class="empty-data"
                >
                    Data jurnal tidak ditemukan.
                </td>

            </tr>

        `;

        return;

    }



    jurnalTableBody.innerHTML =
        data.map(
            function(jurnal, index) {


                /*
                   LINK PUBLIKASI
                */

                let linkHTML = "-";


                if (
                    jurnal.linkPublikasi
                ) {

                    linkHTML = `

                        <a
                            href="${escapeHTML(jurnal.linkPublikasi)}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="publication-link"
                        >
                            Lihat
                        </a>

                    `;

                }



                /*
                   STATUS
                */

                let statusHTML = "-";


                if (jurnal.status) {

                    statusHTML = `

                        <span class="status">

                            ${escapeHTML(
                                jurnal.status
                            )}

                        </span>

                    `;

                }



                /*
                   AKSI ADMIN
                */

                let aksiHTML = "";


                if (isAdmin) {

                    aksiHTML = `

                        <td class="kolom-admin">

                            <button
                                type="button"
                                class="edit-button"
                                onclick="bukaEditModal(${index})"
                            >
                                Edit
                            </button>

                        </td>

                    `;

                }



                return `

                    <tr>

                        <td class="nomor">
                            ${index + 1}
                        </td>


                        <td class="dosen">

                            ${escapeHTML(
                                jurnal.namaDosen
                            )}

                        </td>


                        <td>

                            ${escapeHTML(
                                jurnal.progdi
                            )}

                        </td>


                        <td class="judul">

                            ${escapeHTML(
                                jurnal.judul
                            )}

                        </td>


                        <td>

                            ${escapeHTML(
                                formatPenulis(
                                    jurnal.penulis
                                )
                            )}

                        </td>


                        <td>

                            ${escapeHTML(
                                formatTanggalTampil(
                                    jurnal.tanggalTerbit
                                )
                            )}

                        </td>


                        <td>

                            ${escapeHTML(
                                jurnal.sitasi
                            )}

                        </td>


                        <td>

                            ${statusHTML}

                        </td>


                        <td>

                            ${linkHTML}

                        </td>


                        ${aksiHTML}

                    </tr>

                `;

            }
        )
        .join("");

}



/* =========================================================
   BUKA MODAL EDIT
========================================================= */

function bukaEditModal(index) {

    if (!isAdmin) {

        alert(
            "Anda harus login sebagai Admin."
        );

        return;

    }



    /*
       Ambil data yang sedang tampil
       agar index sesuai pencarian
       dan sorting.
    */

    const dataTampil =
        ambilDataTampil();


    const jurnal =
        dataTampil[index];


    if (!jurnal) {

        alert(
            "Data jurnal tidak ditemukan."
        );

        return;

    }



    /*
       Simpan data asli
       untuk Reset.
    */

    dataSedangDiedit = {
        ...jurnal
    };



    /*
       SIMPAN NOMOR BARIS SPREADSHEET

       Mendukung beberapa kemungkinan
       nama property dari Apps Script.
    */

    const row =
        jurnal.row ||
        jurnal._row ||
        jurnal.rowNumber ||
        jurnal.nomorBaris ||
        "";


    editRow.value =
        row;



    /*
       ISI FORM
    */

    document.getElementById(
        "editNamaDosen"
    ).value =
        jurnal.namaDosen || "";


    document.getElementById(
        "editProgdi"
    ).value =
        jurnal.progdi || "";


    document.getElementById(
        "editLinkPublikasi"
    ).value =
        jurnal.linkPublikasi || "";


    document.getElementById(
        "editJudul"
    ).value =
        jurnal.judul || "";


    document.getElementById(
        "editTanggalTerbit"
    ).value =
        formatTanggalInput(
            jurnal.tanggalTerbit
        );


    document.getElementById(
        "editSitasi"
    ).value =
        jurnal.sitasi || "";


    document.getElementById(
        "editStatus"
    ).value =
        jurnal.status || "";



    /*
       PENULIS
    */

    isiPenulisEdit(
        jurnal.penulis
    );



    /*
       STATUS MESSAGE
    */

    editStatusMessage.innerText = "";

    editStatusMessage.style.color = "";



    /*
       TAMPILKAN MODAL
    */

    editModal.classList.add(
        "show"
    );

    document.body.style.overflow =
        "hidden";

}



/* =========================================================
   ISI PENULIS EDIT
========================================================= */

function isiPenulisEdit(penulis) {

    let daftarPenulis = [];


    if (Array.isArray(penulis)) {

        daftarPenulis =
            [...penulis];

    }
    else {

        daftarPenulis =
            String(penulis || "")
                .split(",")
                .map(
                    function(nama) {
                        return nama.trim();
                    }
                )
                .filter(
                    function(nama) {
                        return nama !== "";
                    }
                );

    }



    if (
        daftarPenulis.length === 0
    ) {

        daftarPenulis = [""];

    }



    editPenulisContainer.innerHTML =
        "";


    daftarPenulis.forEach(
        function(nama) {

            tambahBarisEditPenulis(
                nama
            );

        }
    );


}



/* =========================================================
   TAMBAH BARIS PENULIS
========================================================= */

function tambahBarisEditPenulis(
    nama = ""
) {

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "edit-penulis-row";


    const input =
        document.createElement(
            "input"
        );


    input.type =
        "text";

    input.name =
        "editPenulis[]";

    input.placeholder =
        "Nama penulis";

    input.value =
        nama;



    const button =
        document.createElement(
            "button"
        );


    button.type =
        "button";

    button.className =
        "btn-remove";

    button.innerText =
        "Hapus";


    button.onclick =
        function() {

            hapusEditPenulis(
                button
            );

        };



    row.appendChild(
        input
    );


    row.appendChild(
        button
    );


    editPenulisContainer.appendChild(
        row
    );


    updateTombolHapusEditPenulis();

}



/* =========================================================
   TAMBAH PENULIS
========================================================= */

tambahEditPenulis.addEventListener(
    "click",
    function() {

        tambahBarisEditPenulis();

    }
);



/* =========================================================
   HAPUS PENULIS
========================================================= */

function hapusEditPenulis(button) {

    const rows =
        editPenulisContainer.querySelectorAll(
            ".edit-penulis-row"
        );


    if (rows.length <= 1) {

        return;

    }


    button
        .parentElement
        .remove();


    updateTombolHapusEditPenulis();

}



/* =========================================================
   UPDATE TOMBOL HAPUS PENULIS
========================================================= */

function updateTombolHapusEditPenulis() {

    const rows =
        editPenulisContainer.querySelectorAll(
            ".edit-penulis-row"
        );


    rows.forEach(
        function(row) {

            const button =
                row.querySelector(
                    ".btn-remove"
                );


            if (button) {

                button.style.display =
                    rows.length > 1
                        ? "inline-block"
                        : "none";

            }

        }
    );

}



/* =========================================================
   TUTUP MODAL
========================================================= */

function tutupEditModal() {

    editModal.classList.remove(
        "show"
    );


    document.body.style.overflow =
        "";


    dataSedangDiedit =
        null;


    editStatusMessage.innerText =
        "";

}



/* =========================================================
   CLOSE MODAL
========================================================= */

closeEditModal.addEventListener(
    "click",
    function() {

        tutupEditModal();

    }
);



/* =========================================================
   BATAL
========================================================= */

cancelEditButton.addEventListener(
    "click",
    function() {

        tutupEditModal();

    }
);



/* =========================================================
   KLIK DI LUAR MODAL
========================================================= */

editModal.addEventListener(
    "click",
    function(event) {

        if (
            event.target === editModal
        ) {

            tutupEditModal();

        }

    }
);



/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" &&
            editModal.classList.contains(
                "show"
            )
        ) {

            tutupEditModal();

        }

    }
);



/* =========================================================
   RESET FORM EDIT
========================================================= */

resetEditButton.addEventListener(

    function() {

        if (!dataSedangDiedit) {

            return;

        }



        document.getElementById(
            "editNamaDosen"
        ).value =

        document.getElementById(

        ).value =

        ).value =

            );

            dataSedangDiedit.nomorBaris ||
            "";


        editStatusMessage.innerText =
            "";

    }
);



/* =========================================================
   SUBMIT EDIT
========================================================= */

editJurnalForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();



        if (!isAdmin) {

            alert(
                "Anda harus login sebagai Admin."
            );

            return;

        }



        if (!dataSedangDiedit) {

            return;

        }



        /*
           AMBIL DATA FORM
        */

        const namaDosenInput =
            document.getElementById(
                "editNamaDosen"
            ).value.trim();


        const progdiInput =
            document.getElementById(
                "editProgdi"
            ).value.trim();


        const linkPublikasiInput =
            document.getElementById(
                "editLinkPublikasi"
            ).value.trim();


        const judulInput =
            document.getElementById(
                "editJudul"
            ).value.trim();


        const tanggalTerbitInput =
            document.getElementById(
                "editTanggalTerbit"
            ).value;


        const sitasiInput =
            document.getElementById(
                "editSitasi"
            ).value;


        const statusInput =
            document.getElementById(
                "editStatus"
            ).value;



        /*
           DATA AKHIR

           Jika field edit kosong,
           gunakan data lama.

           Jadi ketika admin hanya
           mengganti Status, Nama Dosen,
           Progdi, Judul, Penulis,
           Tanggal, dan Sitasi tetap ada.
        */

        const namaDosen =
            namaDosenInput !== ""
                ? namaDosenInput
                : String(
                    dataSedangDiedit.namaDosen || ""
                ).trim();


        const progdi =
            progdiInput !== ""
                ? progdiInput
                : String(
                    dataSedangDiedit.progdi || ""
                ).trim();


        const linkPublikasi =
            linkPublikasiInput !== ""
                ? linkPublikasiInput
                : String(
                    dataSedangDiedit.linkPublikasi || ""
                ).trim();


        const judul =
            judulInput !== ""
                ? judulInput
                : String(
                    dataSedangDiedit.judul || ""
                ).trim();


        const tanggalTerbit =
            tanggalTerbitInput !== ""
                ? tanggalTerbitInput
                : formatTanggalInput(
                    dataSedangDiedit.tanggalTerbit
                );


        const sitasi =
            sitasiInput !== ""
                ? sitasiInput
                : String(
                    dataSedangDiedit.sitasi || ""
                ).trim();


        const status =
            statusInput !== ""
                ? statusInput
                : String(
                    dataSedangDiedit.status || ""
                ).trim();



        /* =================================================
           AMBIL PENULIS
        ================================================== */

        const penulisInputs =
            editPenulisContainer.querySelectorAll(
                'input[name="editPenulis[]"]'
            );


        const penulis = [];


        penulisInputs.forEach(
            function(input) {

                const nama =
                    input.value.trim();


                if (nama) {

                    penulis.push(
                        nama
                    );

                }

            }
        );



        /*
           Jika penulis kosong,
           gunakan data penulis lama.
        */

        if (
            penulis.length === 0
        ) {

            if (
                Array.isArray(
                    dataSedangDiedit.penulis
                )
            ) {

                dataSedangDiedit.penulis.forEach(
                    function(nama) {

                        if (
                            String(nama).trim()
                        ) {

                            penulis.push(
                                String(nama).trim()
                            );

                        }

                    }
                );

            }
            else {

                const penulisLama =
                    String(
                        dataSedangDiedit.penulis ||
                        ""
                    )
                        .split(",")
                        .map(
                            function(nama) {
                                return nama.trim();
                            }
                        )
                        .filter(
                            function(nama) {
                                return nama !== "";
                            }
                        );


                penulis.push(
                    ...penulisLama
                );

            }

        }



        /*
           VALIDASI PENULIS

           Hanya dilakukan jika
           memang tidak ada data penulis
           sama sekali.
        */

        if (
            penulis.length === 0
        ) {

            editStatusMessage.style.color =
                "#dc2626";


            editStatusMessage.innerText =
                "Minimal satu penulis harus diisi.";


            return;

        }



        /* =================================================
           ROW SPREADSHEET
        ================================================== */

        const row =
            dataSedangDiedit.row ||
            dataSedangDiedit._row ||
            dataSedangDiedit.rowNumber ||
            dataSedangDiedit.nomorBaris ||
            editRow.value ||
            "";


        if (!row) {

            editStatusMessage.style.color =
                "#dc2626";


            editStatusMessage.innerText =
                "Nomor baris data tidak ditemukan.";


            console.error(
                "Data jurnal tidak memiliki nomor baris:",
                dataSedangDiedit
            );


            return;

        }



        /* =================================================
           DATA USER
        ================================================== */

        let user = {};


        try {

            user =
                JSON.parse(
                    localStorage.getItem(
                        "user"
                    ) || "{}"
                );

        }
        catch (error) {

            user = {};

        }


        const username =
            user.username ||
            user.email ||
            "";



        /* =================================================
           BUTTON LOADING
        ================================================== */

        saveEditButton.disabled =
            true;


        saveEditButton.innerText =
            "Menyimpan...";


        editStatusMessage.innerText =
            "";



        /* =================================================
           DATA UPDATE
        ================================================== */

        const dataUpdate = {

            namaDosen:
                namaDosen,

            progdi:
                progdi,

            linkPublikasi:
                linkPublikasi,

            judul:
                judul,

            penulis:
                penulis,

            tanggalTerbit:
                tanggalTerbit,

            sitasi:
                sitasi,

            status:
                status

        };



        console.log(
            "Data yang dikirim:",
            {
                action: "updateJurnal",
                username: username,
                row: row,
                data: dataUpdate
            }
        );



        /* =================================================
           KIRIM KE APPS SCRIPT
        ================================================== */

        try {

            const response =
                await fetch(
                    JURNAL_TABLE_API_URL,
                    {
                        method: "POST",

                        redirect: "follow",

                        headers: {

                            "Content-Type":
                                "text/plain;charset=utf-8"

                        },

                        body:
                            JSON.stringify({

                                action:
                                    "updateJurnal",

                                username:
                                    username,

                                row:
                                    row,

                                data:
                                    dataUpdate

                            })

                    }
                );



            if (!response.ok) {

                throw new Error(
                    "Server error: " +
                    response.status
                );

            }



            const result =
                await response.json();


            console.log(
                "Response update jurnal:",
                result
            );



            /* =================================================
               BERHASIL
            ================================================== */

            if (result.success) {

                editStatusMessage.style.color =
                    "#15803d";


                editStatusMessage.innerText =
                    result.message ||
                    "Data jurnal berhasil diperbarui.";



                /*
                   UPDATE DATA LOKAL

                   Cari berdasarkan row,
                   bukan hanya object reference.
                */

                const index =
                    semuaDataJurnal.findIndex(
                        function(item) {

                            const itemRow =
                                item.row ||
                                item._row ||
                                item.rowNumber ||
                                item.nomorBaris ||
                                "";


                            return String(itemRow) ===
                                String(row);

                        }
                    );


                if (index !== -1) {

                    semuaDataJurnal[index] = {

                        ...semuaDataJurnal[index],

                        namaDosen:
                            namaDosen,

                        progdi:
                            progdi,

                        linkPublikasi:
                            linkPublikasi,

                        judul:
                            judul,

                        penulis:
                            penulis,

                        tanggalTerbit:
                            tanggalTerbit,

                        sitasi:
                            sitasi,

                        status:
                            status,

                        row:
                            row

                    };

                }



                /*
                   Tutup modal setelah berhasil.
                */

                setTimeout(
                    function() {

                        tutupEditModal();

                        prosesData();

                    },
                    700
                );

            }



            /* =================================================
               GAGAL DARI SERVER
            ================================================== */

            else {

                editStatusMessage.style.color =
                    "#dc2626";


                editStatusMessage.innerText =
                    result.message ||
                    "Data jurnal gagal diperbarui.";

            }

        }



        /* =================================================
           ERROR CONNECTION
        ================================================== */

        catch (error) {

            console.error(
                "ERROR UPDATE JURNAL:",
                error
            );


            editStatusMessage.style.color =
                "#dc2626";


            editStatusMessage.innerText =
                "Tidak dapat terhubung ke server.";

        }



        /* =================================================
           KEMBALIKAN BUTTON
        ================================================== */

        saveEditButton.disabled =
            false;


        saveEditButton.innerText =
            "Simpan Perubahan";

    }
);



/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    function() {

        prosesData();

    }
);



/* =========================================================
   SORTING
========================================================= */

sortTanggal.addEventListener(

resetFilter.addEventListener(

        sortTanggal.value =

</script>
