<script>


/* =========================================================
   API
========================================================= */

const BUKU_TABLE_API_URL =
    "https://script.google.com/macros/s/AKfycby9EAteDad4Z-TIbHBaZ2UU6q4XAb1WJI-nPL307EiH5ENU3gjOcsbHy3inkT-XH3DFZw/exec";



/* =========================================================
   ELEMENT
========================================================= */

const bukuTableBody =
    document.getElementById(
        "bukuTableBody"
    );


const jumlahData =
    document.getElementById(
        "jumlahData"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const sortSelect =
    document.getElementById(
        "sortSelect"
    );


const navToggle =
    document.getElementById(
        "navToggle"
    );


const navMenu =
    document.getElementById(
        "navMenu"
    );


let semuaDataBuku = [];



/* =========================================================
   NAVBAR MOBILE
========================================================= */

if (
    navToggle &&
    navMenu
) {

    navToggle.addEventListener(
        "click",
        function () {

            navMenu.classList.toggle(
                "active"
            );

        }
    );

}



/* =========================================================
   LOAD DATA
========================================================= */

async function loadBukuTable() {

    try {

        const response =
            await fetch(
                BUKU_TABLE_API_URL +
                "?action=getBuku"
            );


        if (!response.ok) {

            throw new Error(
                "Gagal mengambil data."
            );

        }


        const result =
            await response.json();


        if (
            !result.success ||
            !Array.isArray(result.data)
        ) {

            throw new Error(
                result.message ||
                "Data buku tidak tersedia."
            );

        }


        semuaDataBuku =
            result.data;


        prosesData();


    }
    catch (error) {

        console.error(
            error
        );


        jumlahData.innerText =
            "0 data";


        bukuTableBody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty-data"
                >
                    Data buku tidak dapat
                    ditampilkan.
                </td>

            </tr>

        `;

    }

}



/* =========================================================
   PROSES DATA
========================================================= */

function prosesData() {

    let data =
        [...semuaDataBuku];


    const keyword =
        searchInput.value
            .trim()
            .toLowerCase();


    if (keyword) {

        data =
            data.filter(
                function (buku) {

                    const teks = [

                        buku.judul,
                        buku.penulis,
                        buku.penerbit,
                        buku.isbn,
                        buku.hki,
                        buku.status

                    ]

                        .map(
                            function (item) {

                                return String(
                                    item || ""
                                ).toLowerCase();

                            }
                        )

                        .join(" ");


                    return teks.includes(
                        keyword
                    );

                }
            );

    }


                const sortValue =
                    sortSelect.value;


                    /* =====================================================
                    URUTKAN DATA
                    ===================================================== */

                    if (sortValue === "terbaru") {

                        /*
                        * Data terbaru berada di bagian akhir
                        * dari data yang dikirim oleh API.
                        */
                        data.reverse();

                    }
                    else if (sortValue === "terlama") {

                        /*
                        * Urutan asli data dari API.
                        */

                    }
                    else if (
                        sortValue === "penulis-asc" ||
                        sortValue === "penulis-desc"
                    ) {

                    data.sort(
                        function (a, b) {

                            const penulisA =
                                String(
                                    a.penulis || ""
                                )
                                .trim()
                                .toLowerCase();


                            const penulisB =
                                String(
                                    b.penulis || ""
                                )
                                .trim()
                                .toLowerCase();


                            const hasil =
                                penulisA.localeCompare(
                                    penulisB,
                                    "id",
                                    {
                                        sensitivity: "base"
                                    }
                                );


                            return sortValue === "penulis-asc"
                                ? hasil
                                : -hasil;

                        }
                    );

                }


    tampilkanBuku(
        data
    );

}



/* =========================================================
   STATUS
========================================================= */

function tampilkanStatus(status) {

    const nilai =
        String(
            status || ""
        );


    const lower =
        nilai.toLowerCase();


    let className =
        "status";


    if (
        lower === "belum di ajukan"
    ) {

        className +=
            " status-belum";

    }

    else if (
        lower === "proses di ajukan"
    ) {

        className +=
            " status-proses";

    }

    else if (
        lower === "sudah di ajukan"
    ) {

        className +=
            " status-sudah";

    }

    else if (
        lower === "di tolak"
    ) {

        className +=
            " status-tolak";

    }


    return `

        <span class="${className}">

            ${escapeHTML(
                nilai || "-"
            )}

        </span>

    `;

}



/* =========================================================
   TAMPILKAN BUKU
========================================================= */

function tampilkanBuku(data) {

    jumlahData.innerText =
        data.length +
        " data";


    if (
        data.length === 0
    ) {

        bukuTableBody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty-data"
                >
                    Data buku tidak ditemukan.
                </td>

            </tr>

        `;


        return;

    }


    bukuTableBody.innerHTML =

        data.map(
            function (
                buku,
                index
            ) {

                let coverHTML = `

                    <span class="cover-empty">

                        Tidak ada cover

                    </span>

                `;


                if (
                    buku.cover
                ) {

                    coverHTML = `

                        <a
                            href="${escapeHTML(
                                buku.cover
                            )}"
                            target="_blank"
                            class="cover-thumbnail-link"
                            title="Klik untuk melihat cover"
                        >

                            <img
                                src="${escapeHTML(
                                    buku.cover
                                )}"
                                alt="Cover ${escapeHTML(
                                    buku.judul
                                )}"
                                class="cover-thumbnail"
                                onerror="
                                    this.style.display='none';
                                    this.parentElement.innerHTML='<span class=&quot;cover-empty&quot;>Cover tidak tersedia</span>';
                                "
                            >

                        </a>

                    `;

                }


                return `

                    <tr>

                        <td class="nomor">

                            ${index + 1}

                        </td>


                        <td class="judul">

                            ${escapeHTML(
                                buku.judul
                            )}

                        </td>


                        <td>

                            ${escapeHTML(
                                buku.penulis
                            )}

                        </td>


                        <td>

                            ${escapeHTML(
                                buku.penerbit
                            )}

                        </td>


                        <td>

                            ${escapeHTML(
                                buku.isbn
                            )}

                        </td>


                        <td>

                            ${escapeHTML(
                                buku.hki
                            )}

                        </td>


                        <td>

                            ${tampilkanStatus(
                                buku.status
                            )}

                        </td>


                        <td>

                            ${coverHTML}

                        </td>

                    </tr>

                `;

            }

        ).join("");

}



/* =========================================================
   RESET
========================================================= */

function resetFilter() {

    searchInput.value =
        "";


    sortSelect.value =
        "default";


    prosesData();

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(
        value || ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================================
   EVENT
========================================================= */

searchInput.addEventListener(
    "input",
    prosesData
);


sortSelect.addEventListener(
    "change",
    prosesData
);



/* =========================================================
   KEMBALI
========================================================= */

function kembali() {

    window.close();

}



/* =========================================================
   CETAK LAPORAN
========================================================= */

        );

    }


    /*
     * ========================================================
     * CEK DATA YANG SEDANG DITAMPILKAN
     * ========================================================
     */

        Array.from(
            table.querySelectorAll(
                "tbody tr"
            )
        ).filter(
            function (row) {

                    !row.classList.contains(
                        "loading"
                    ) &&
                    !row.querySelector(
                        ".empty-data"
                    )
                );

            }
        );

        visibleRows.length === 0

            "Tidak ada data yang dapat dicetak."
        );

     * MODAL PILIH KOLOM

                        text-align: center;

                        font-size: 14px;
                    "
                >
                    Centang kolom yang ingin dimasukkan

                        <input

                        No

                        style="

                    >

                        <input
                            type="checkbox"

                            data-index="1"
                            checked
                        >

                        Judul Buku

                    </label>


                    <label

                            display: flex;
                            align-items: center;
                            gap: 8px;
                            padding: 10px;
                            border: 1px solid #d1d5db;

                            cursor: pointer;

                    >

                        <input
                            type="checkbox"
                            class="pilih-kolom"

                    </label>


                    <label

                            display: flex;

/* =========================================================
   MODAL ORIENTASI
========================================================= */

) {

            "div"
        );


    orientasiWrapper.innerHTML = `

        <div
            style="
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.45);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 99999;
                font-family: Arial, Helvetica, sans-serif;
            "
        >

            <div
                style="
                    width: 380px;
                    max-width: 92%;
                    background: #ffffff;
                    border-radius: 12px;
                    padding: 25px;
                    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
                    text-align: center;
                "
            >

                <h3
                    style="
                        margin: 0 0 8px 0;
                        font-size: 20px;
                        color: #1f2937;
                    "

                    Pilih Orientasi Kertas

                <p

                        margin: 0 0 22px 0;
                        font-size: 14px;
                        color: #6b7280;
                    "
                >
                    Pilih orientasi yang digunakan
                    saat mencetak.
                </p>

                    style="
                        display: flex;
                        gap: 12px;
                        margin-bottom: 12px;
                    "
                >

                        type="button"

                            border-radius: 8px;

                            color: white;
                            font-size: 14px;
                            font-weight: bold;
                            cursor: pointer;

        );

     * ========================================================
     * BATAL
     * ========================================================
     */

        function () {

    );

     * ========================================================
     * FUNGSI PROSES CETAK
     * ========================================================
     */

        orientasi
    ) {

        orientasiWrapper.remove();


        /*
         * ====================================================
         * AMBIL HANYA BARIS YANG SEDANG TERLIHAT
         * ====================================================
         */

        const originalRows =
            Array.from(
                table.querySelectorAll(
                    "tbody tr"
                )
            );


        const visibleRows =
            originalRows.filter(
                function (row) {

                    const style =
                        window.getComputedStyle(
                            row
                        );


                    return (
                        style.display !==
                        "none"
                        &&
                        !row.querySelector(
                            ".empty-data"
                        )
                        &&
                        !row.querySelector(
                            ".loading"
                        )
                    );

                }
            );


        if (
            visibleRows.length === 0
        ) {

            alert(
                "Tidak ada data yang dapat dicetak."
            );

            return;

        }



        /*
         * ====================================================
         * BUAT CLONE TABEL
         * ====================================================
         */

        const tableClone =
            table.cloneNode(
                true
            );


        const clonedRows =
            Array.from(
                tableClone.querySelectorAll(
                    "tbody tr"
                )
            );


        /*
         * Hapus semua baris clone terlebih dahulu
         */
        clonedRows.forEach(
            function (row) {

                row.remove();

            }
        );


        /*
         * Masukkan hanya baris yang sedang terlihat
         */
        visibleRows.forEach(
            function (originalRow) {

                tableClone
                    .querySelector(
                        "tbody"
                    )
                    .appendChild(
                        originalRow.cloneNode(
                            true
                        )
                    );

            }
        );



        /*
         * ====================================================
         * HAPUS KOLOM YANG TIDAK DIPILIH
         * ====================================================
         */

        const semuaRows =
            tableClone.querySelectorAll(
                "tr"
            );


        semuaRows.forEach(
            function (row) {

                const cells =
                    Array.from(
                        row.children
                    );


                cells.forEach(
                    function (
                        cell,
                        index
                    ) {

                        if (
                            !kolomDipilih.includes(
                                index
                            )
                        ) {

                            cell.remove();

                        }

                    }
                );

            }
        );



        /*
         * ====================================================
         * BUKA JENDELA CETAK
         * ====================================================
         */

        const printWindow =
            window.open(
                "",
                "_blank",
                "width=1200,height=800"
            );


        if (!printWindow) {

            alert(
                "Jendela cetak diblokir oleh browser. Silakan izinkan pop-up untuk halaman ini."
            );

            return;

        }

        const images =
            printWindow.document.querySelectorAll(

            );


        if (
            images.length === 0
        ) {

            setTimeout(
                function () {

                    printWindow.focus();

                    printWindow.print();

                },
                400
            );

            return;

        }



        let imagesLoaded =
            0;


        function cekGambarSelesai() {

            imagesLoaded++;


            if (
                imagesLoaded >=
                images.length
            ) {

                setTimeout(
                    function () {

                        printWindow.focus();

                        printWindow.print();

                    },
                    300
                );

            }

        }


        images.forEach(
            function (img) {

                if (
                    img.complete
                ) {

                    cekGambarSelesai();

                }
                else {

                    img.addEventListener(
                        "load",
                        cekGambarSelesai
                    );


                    img.addEventListener(
                        "error",
                        cekGambarSelesai
                    );

                }

            }
        );

    }
